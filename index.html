
<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Swipe</title>
  <link rel="stylesheet" href="./output.css">
</head>

<body class="min-h-screen bg-[#080808] text-white overflow-x-hidden">

  <main class="min-h-dvh flex items-center justify-center px-4 py-5 md:px-6 md:py-6">

    <section class="w-full max-w-sm">

      <div class="mb-4 md:mb-6 text-center">

        <p class="text-xs md:text-sm uppercase tracking-[0.3em] text-[#E50914] font-semibold">
          Movie Swipe
        </p>

        <h1 class="mt-2 text-[32px] lg:text-[48px] font-bold leading-tight">
          Vyber si film
        </h1>

      </div>

      <div class="movies"></div>

      <!-- TLAČÍTKA PO DOKONČENÍ SWIPOVÁNÍ -->
      <div id="recommendation-actions" class="hidden mt-6 space-y-3">

        <button
          id="next-recommendation"
          type="button"
          class="w-full rounded-xl bg-[#E50914] px-5 py-4 text-sm md:text-base font-bold text-white cursor-pointer transition-colors hover:bg-[#b80710]"
        >
          Další doporučený film →
        </button>

        <div class="grid grid-cols-2 gap-3">

          <button
            id="restart-swipe"
            type="button"
            class="rounded-xl border border-[#333333] bg-[#151515] px-3 py-4 text-sm font-semibold cursor-pointer transition-colors hover:bg-[#242424]"
          >
            ↻ Začít znovu
          </button>

          <button
            id="show-overview"
            type="button"
            class="rounded-xl border border-[#333333] bg-[#151515] px-3 py-4 text-sm font-semibold cursor-pointer transition-colors hover:bg-[#242424]"
          >
            Přehled swipů ↓
          </button>

        </div>

      </div>

    </section>

  </main>

  <section
    id="swipe-overview"
    class="overview py-16 md:py-24 bg-[#0d0d0d] border-t border-[#1f1f1f]"
  >

    <div class="max-w-5xl mx-auto px-6">

      <div class="mb-12 text-center">

        <p class="text-sm uppercase tracking-[0.3em] text-[#E50914] font-semibold">
          Vaše volby
        </p>

        <h2 class="mt-2 text-3xl md:text-4xl font-black">
          Přehled swipů
        </h2>

      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

        <!-- LIKED -->
        <div class="rounded-[28px] bg-[#121212] border border-[#242424] p-6 md:p-7">

          <div class="flex items-center justify-between pb-5 mb-5 border-b border-[#242424]">

            <h3 class="text-2xl font-bold">Liked</h3>

            <div class="w-10 h-10 rounded-full bg-black flex items-center justify-center text-[#E50914] font-bold">
              ✓
            </div>

          </div>

          <div class="overview-liked space-y-3"></div>

        </div>

        <!-- DISLIKED -->
        <div class="rounded-[28px] bg-[#121212] border border-[#242424] p-6 md:p-7">

          <div class="flex items-center justify-between pb-5 mb-5 border-b border-[#242424]">

            <h3 class="text-2xl font-bold">Disliked</h3>

            <div class="w-10 h-10 rounded-full bg-black flex items-center justify-center text-[#E50914] font-bold">
              ✕
            </div>

          </div>

          <div class="overview-disliked space-y-3"></div>

        </div>

      </div>

    </div>

  </section>

  <script src="./script.js"></script>
</body>
</html>
