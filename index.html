
<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Movie Swipe</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="./output.css">
  <link rel="stylesheet" href="./style.css">
</head>

<body class="min-h-screen overflow-x-hidden bg-[#080808] text-white">

  <!-- MAIN -->
  <main class="flex min-h-dvh items-center justify-center px-4 py-8 sm:px-6 sm:py-12 lg:py-16">

    <section class="w-full max-w-[680px]">

      <!-- INTRO -->
      <div class="mb-7 text-center sm:mb-10">

        <p class="text-[11px] leading-relaxed font-semibold uppercase tracking-[0.12em] text-[#E50914] sm:text-xs sm:tracking-[0.18em] md:text-sm">
          Po swajpnutí 8 filmů ti doporučím, na co se máš podívat
        </p>

        <h1 class="mt-4 text-[28px] leading-[1.12] font-bold tracking-tight sm:text-[38px] lg:text-[48px]">
          Swajp doleva je dislike, swajp doprava je like
        </h1>

      </div>

      <!-- MOVIE CONTAINER -->
      <div class="movies"></div>

      <!-- RECOMMENDATION ACTIONS -->
      <div id="recommendation-actions" class="mt-8 hidden space-y-3">

        <button
          id="next-recommendation"
          type="button"
          class="w-full cursor-pointer rounded-2xl bg-[#E50914] px-5 py-4 text-sm font-bold text-white transition-colors hover:bg-[#b80710] sm:text-base"
        >
          Další doporučený film →
        </button>

        <div class="grid grid-cols-2 gap-3">

          <button
            id="restart-swipe"
            type="button"
            class="cursor-pointer rounded-2xl border border-[#333333] bg-[#151515] px-3 py-4 text-xs font-semibold transition-colors hover:bg-[#242424] sm:text-sm"
          >
            ↻ Začít znovu
          </button>

          <button
            id="show-overview"
            type="button"
            class="cursor-pointer rounded-2xl border border-[#333333] bg-[#151515] px-3 py-4 text-xs font-semibold transition-colors hover:bg-[#242424] sm:text-sm"
          >
            Přehled swipů ↓
          </button>

        </div>

      </div>

    </section>

  </main>

  <!-- SWIPE OVERVIEW -->
  <section
    id="swipe-overview"
    class="overview hidden border-t border-[#1f1f1f] bg-[#0d0d0d] py-16 md:py-24"
  >

    <div class="mx-auto max-w-5xl px-4 sm:px-6">

      <div class="mb-10 text-center md:mb-12">

        <p class="text-xs font-semibold uppercase tracking-[0.2em] text-[#E50914] sm:text-sm">
          Vaše volby
        </p>

        <h2 class="mt-2 text-3xl font-black md:text-4xl">
          Přehled swipů
        </h2>

      </div>

      <div class="grid grid-cols-1 gap-5 md:grid-cols-2 md:gap-6">

        <!-- LIKED -->
        <div class="rounded-[24px] border border-[#242424] bg-[#121212] p-5 sm:p-6 md:rounded-[28px] md:p-7">

          <div class="mb-5 flex items-center justify-between border-b border-[#242424] pb-5">

            <h3 class="text-2xl font-bold">
              Liked
            </h3>

            <div class="flex h-10 w-10 items-center justify-center rounded-full bg-black font-bold text-[#E50914]">
              ✓
            </div>

          </div>

          <div class="overview-liked space-y-3"></div>

        </div>

        <!-- DISLIKED -->
        <div class="rounded-[24px] border border-[#242424] bg-[#121212] p-5 sm:p-6 md:rounded-[28px] md:p-7">

          <div class="mb-5 flex items-center justify-between border-b border-[#242424] pb-5">

            <h3 class="text-2xl font-bold">
              Disliked
            </h3>

            <div class="flex h-10 w-10 items-center justify-center rounded-full bg-black font-bold text-[#E50914]">
              ✕
            </div>

          </div>

          <div class="overview-disliked space-y-3"></div>

        </div>

      </div>

    </div>

  </section>

  <script src="./script.js"></script>

</body>
</html>
